          '<div class="note gold">这会移除 <b>' + E.seedErrorCount() + ' 条内置示例错题</b>，并隐藏预置的 3 次模考成绩（452 → 478 → 500）。</div>' +

        break;
      case 'confirm-reset':
        E.reset(); S = E.state; resetUI(); closeModal(); navigate('dashboard'); refreshChrome(); toast('记忆已重置'); break;
      case 'open-memory':
        INSPECTOR.classList.add('open'); switchInsp('memory');

      case 'open-profile': openProfile(); break;

  var CHAT_KEY = 'cet4-agent-chat-v1';
  function loadChat() {
    try {
      var raw = localStorage.getItem(CHAT_KEY);
      var arr = raw ? JSON.parse(raw) : null;
      if (Array.isArray(arr)) ui.chatLog = arr;
    } catch (e) { ui.chatLog = []; }
  }
  function saveChat() {
    try { localStorage.setItem(CHAT_KEY, JSON.stringify(ui.chatLog.slice(-12))); } catch (e) { }
  }

  function resetUI() {
    ui.deck = null; ui.sentId = null; ui.customSentence = null; ui.listenId = null;
    ui.listenZh = false; ui.listenIdx = -1; ui.trId = null; ui.trResult = null;
    ui.essayPrompt = null; ui.essayResult = null; ui.essayDraft = ''; ui.reviewFilter = 'active';
    ui.reviewTag = ''; ui.kbDocId = null; ui.kbQuery = ''; ui.chatLog = []; ui.chatBusy = false;
    try { localStorage.removeItem(CHAT_KEY); } catch (e) { }
    ui.practiceTags = null; ui.practiceQuestions = null; ui.lastRun = null; ui.trDrafts = {};

  function saveLLM() {
    var u = document.getElementById('llmUrl');
    var m = document.getElementById('llmModel');
    var k = document.getElementById('llmKey');
    if (!u) return;
    S.settings.llm.baseUrl = (u.value.trim() || 'https://api.openai.com/v1').replace(/\/+$/, '');
    S.settings.llm.model = m.value.trim() || 'gpt-4o-mini';
    S.settings.llm.apiKey = k.value.trim();
    E.save(); render(); refreshChrome();
    toast(S.settings.llm.apiKey ? 'LLM 配置已保存' : '已保存，当前仍是本地模式');
  }

  async function testLLM() {
    var el = document.getElementById('llmStatus');
    saveLLM();
    el = document.getElementById('llmStatus');
    if (el) el.innerHTML = '<span class="c-gold">正在连接…</span>';
    try {
      await E.testLLM();
      if (el) el.innerHTML = '<span class="c-jade">连接成功，回答会优先走 LLM</span>';
      toast('LLM 连接成功');
    } catch (err) {
      if (el) el.innerHTML = '<span class="c-red">连接失败：' + h(err.message) + '（仍可用本地模式）</span>';
      toast('连接失败，已保留本地模式', true);
    }
  }

  function rateWord(rating) {
    var d = ui.deck;
    if (!d || d.idx >= d.words.length) return;
    var w = d.words[d.idx];
    var rec = E.scheduleWord(w.id, rating);
    d.results.push({ id: w.id, rating: rating });
    E.addMinutes(1);
    E.logEvent('word', '复习单词：' + w.w, rating + ' · 下次 ' + rec.due);
    d.idx += 1; d.flipped = false;
    render(); refreshChrome();
    toast(w.w + ' · 下次复习 ' + rec.due);
  }

  function playLine(i) {
    var set = E.pickListening(ui.listenId);
    var line = set.transcript[i];
    if (!line) return;
    ui.listenIdx = i;
    document.querySelectorAll('.tline').forEach(function (n) { n.classList.toggle('sel', +n.getAttribute('data-i') === i); });
    speak(line.en, 0.92);
  }
  function playListening(id) {
    var set = E.pickListening(id || ui.listenId);
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音朗读', true); return; }
    speechSynthesis.cancel();
    ui.listenIdx = -1;
    set.transcript.forEach(function (l, i) {
      var u = new SpeechSynthesisUtterance(l.en);
      u.lang = 'en-US'; u.rate = 0.9;
      u.onstart = function () {
        ui.listenIdx = i;
        document.querySelectorAll('.tline').forEach(function (n) { n.classList.toggle('sel', +n.getAttribute('data-i') === i); });
      };
      speechSynthesis.speak(u);
    });
    toast('开始播放 ' + set.title);
  }

  function livePhrases() {
    var item = (window.TRANSLATIONS || []).filter(function (x) { return x.id === ui.trId; })[0];
    if (!item) return;
    var text = E.norm(document.getElementById('trInput').value);
    var hits = 0;
    document.querySelectorAll('.keyphrase').forEach(function (kp, i) {
      var p = item.phrases[i];
      if (!p) return;
      var ok = false;
      [p.en].concat(p.alts || []).forEach(function (alt) {
        if (alt && text.indexOf(E.norm(alt)) >= 0) ok = true;
      });
      kp.classList.toggle('hit', ok);
      if (ok) hits += 1;
      var ic = kp.querySelector('.kp-ic');
      if (ic) ic.innerHTML = ok ? icon('i-check') : '·';
    });
  }

  /* ---------------- 事件绑定 ---------------- */
  document.addEventListener('click', function (ev) {
    var nav = ev.target.closest('.nav-item[data-route]');
    if (nav) { ev.preventDefault(); navigate(nav.getAttribute('data-route')); return; }
    var qa = ev.target.closest('[data-qact]');
    if (qa) {
      ev.preventDefault();
      quizAction(qa.getAttribute('data-qact'), qa.getAttribute('data-qid'), qa.getAttribute('data-i'));
      return;
    }
    var act = ev.target.closest('[data-act]');
    if (!act || act.disabled) return;
    handleAction(act, ev);
  });

  document.addEventListener('change', function (ev) {
    if (ev.target.id === 'essayPrompt') { ui.essayPrompt = ev.target.value; ui.essayResult = null; render(); }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'essayInput') {
      ui.essayDraft = t.value;
      var wc = document.getElementById('wc');
      if (wc) wc.textContent = (t.value.trim().match(/[A-Za-z']+/g) || []).length + ' 词';
    }
    if (t.id === 'trInput') {
      ui.trDrafts[ui.trId] = t.value;
      livePhrases();
    }
  });

  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var inField = /INPUT|TEXTAREA|SELECT/.test(t.tagName);
    if (ev.key === 'Escape') {
      if (isModalOpen()) closeModal();
      else if (INSPECTOR.classList.contains('open')) INSPECTOR.classList.remove('open');
      else closeRail();
      return;
    }
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k') {
      ev.preventDefault(); navigate('chat');
      setTimeout(function () { var i = document.getElementById('chatInput'); if (i) i.focus(); }, 220);
      return;
    }
    if (t.id === 'chatInput' && ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault(); sendChat(t.value); return;
    }
    if (t.id === 'kbInput' && ev.key === 'Enter') {
      ev.preventDefault(); var btn = document.querySelector('[data-act="kb-search"]'); if (btn) btn.click(); return;
    }
    if (t.id === 'essayInput' && (ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') {
      ev.preventDefault(); var g = document.querySelector('[data-act="grade-essay"]'); if (g) g.click(); return;
    }
    if (ev.code === 'Space' && !inField && ui.route === 'words' && ui.deck && ui.deck.idx < ui.deck.words.length) {
      ev.preventDefault();
      ui.deck.flipped = !ui.deck.flipped;
      var fl = document.querySelector('.flash'); if (fl) fl.classList.toggle('flipped', ui.deck.flipped);
    }
  });

  function init() {
    if (!S.events.length) {
      E.logEvent('system', '创建学习画像', '本地 Agent 已就绪，开始记录学习记忆');
    }
    if (!ui.trDrafts) ui.trDrafts = {};
    loadChat();
    document.getElementById('menuBtn').addEventListener('click', function () { document.getElementById('rail').classList.add('open'); });
    document.getElementById('railClose').addEventListener('click', closeRail);
    document.getElementById('inspClose').addEventListener('click', function () { INSPECTOR.classList.remove('open'); });
    document.getElementById('inspBtn').addEventListener('click', function () {
      if (window.innerWidth <= 1200) { INSPECTOR.classList.add('open'); return; }
      var order = ['trace', 'rag', 'memory'];
      switchInsp(order[(order.indexOf(ui.inspTab) + 1) % order.length]);
    });
    document.getElementById('bellBtn').addEventListener('click', openReminders);
    document.getElementById('avatarBtn').addEventListener('click', openProfile);
    document.querySelectorAll('#inspTabs .insp-tab').forEach(function (t) {
      t.addEventListener('click', function () { switchInsp(t.getAttribute('data-itab')); });
    });
    window.addEventListener('hashchange', function () {
      render();
      VIEW.scrollTop = 0;
      if (window.innerWidth <= 980) INSPECTOR.classList.remove('open');
    });
    render();
    if (!location.hash) location.replace('#/dashboard');
    window.CET4App = { ui: ui, render: render, navigate: navigate, refresh: refreshChrome };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
</body>
</html>
