<script>
/* assets/js/engine.js */
/* ============================================================
   四级智备 · Agent Engine
   - 本地 RAG：BM25 检索 24 篇知识库
   - 记忆：localStorage（画像 / SRS / 错题 / 事件）
   - 工具：检索、组卷、评分、复盘、计划
   - LLM：可选 OpenAI 兼容接口，无 key 时全本地运行
   ============================================================ */
(function () {
  'use strict';

  var KEY = 'cet4-agent-memory-v1';
  var DAY = 86400000;

  /* 可选增强：默认使用 assets/js/config.js 中的本机演示配置 */
  var LLM_DEFAULT = Object.assign({
    baseUrl: 'https://api.openai.com/v1',
    apiKey: '',
    model: 'gpt-4o-mini'
  }, window.CET4_LLM_CONFIG || {});

  /* ---------------- 基础工具 ---------------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(s, n) { var d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / DAY); }
  function today() { return iso(new Date()); }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
  function round(n, p) { var m = Math.pow(10, p || 0); return Math.round(n * m) / m; }
  function uid(prefix) { return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6); }
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[’‘]/g, "'").replace(/[“”]/g, '"')
      .replace(/[^a-z0-9\u4e00-\u9fa5']+/g, ' ')
      .replace(/\s+/g, ' ').trim();
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function uniq(a) { var seen = {}; return a.filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; }); }
  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; }
    return r;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  /* ---------------- 记忆 ---------------- */
  function defaultState() {
    return {
      version: 1,
      profile: {
        name: '同学',
        target: 520,
        examDate: '2026-12-19',
        dailyMinutes: 40,
        joined: today()
      },
      stats: {
        streak: 0,
        lastDay: null,
        days: [],
        minutes: 0,
        byTag: {},
        answered: 0,
        correct: 0
      },
      srs: {},
      errors: (window.SEED_ERRORS || []).map(function (e) { return Object.assign({ seed: true }, e); }),
      events: [],
      chat: [],
      plan: { date: null, tasks: [] },
      flags: { demo: true },
      settings: {
        llm: Object.assign({}, LLM_DEFAULT),
        motion: true
      }
    };
  }

  var state;
  try {
    var raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : null;
  } catch (e) { state = null; }
  if (!state || !state.version) state = defaultState();

  // 修补旧数据
  state.profile = Object.assign(defaultState().profile, state.profile || {});
  state.stats = Object.assign(defaultState().stats, state.stats || {});
  state.settings = Object.assign(defaultState().settings, state.settings || {});
  state.settings.llm = Object.assign(defaultState().settings.llm, state.settings.llm || {});
  if (!state.srs) state.srs = {};
  if (!Array.isArray(state.errors)) state.errors = defaultState().errors;
  if (!Array.isArray(state.events)) state.events = [];
  if (!Array.isArray(state.chat)) state.chat = [];
  if (!state.plan) state.plan = { date: null, tasks: [] };

  /* 示例数据标记：老存档里的 7 条种子错题没有 seed 字段，按 id 回填，
     保证已有用户也能看到「这是示例」的提示并一键清空。 */
  if (!state.flags || typeof state.flags.demo !== 'boolean') {
    state.flags = Object.assign({ demo: true }, state.flags || {});
  }
  (function markSeed() {
    var ids = {};
    (window.SEED_ERRORS || []).forEach(function (e) { ids[e.id] = 1; });
    (state.errors || []).forEach(function (e) {
      if (!e) return;
      if (typeof e.seed !== 'boolean') e.seed = !!ids[e.id];
    });
  })();

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 隐私模式忽略 */ }
    return state;
  }

  // 老记忆里没有 Key 时，自动接入 config.js 的本机演示配置
  if (!state.settings.llm.apiKey && LLM_DEFAULT.apiKey) {
    state.settings.llm = Object.assign({}, state.settings.llm, LLM_DEFAULT);
    save();
  }
  function reset() {
    state = defaultState();
    try { localStorage.removeItem(KEY); } catch (e) {}
    save();
    return state;
  }

  /* 示例数据开关
     demo = true ：首次进入时展示内置样本（7 条示例错题 + 3 次模考历史），
                   避免新访客打开就是空白，方便演示。
     demo = false：只保留访客自己作答产生的记录，示例错题与预置模考一并隐藏。
     注意：示例数据只写进各自浏览器的 localStorage，不上传任何服务器，
     所以不同电脑看到的是同一份「内置样本」，不是别人的真实记录。 */
  function isDemo() { return !!(state.flags && state.flags.demo); }
  function seedErrorCount() {
    return (state.errors || []).filter(function (e) { return e && e.seed; }).length;
  }
  function clearDemo() {
    state.errors = (state.errors || []).filter(function (e) { return e && !e.seed; });
    state.flags.demo = false;
    save();
    return state;
  }
  function restoreDemo() {
    var exist = {};
    (state.errors || []).forEach(function (e) { if (e) exist[e.id] = 1; });
    (window.SEED_ERRORS || []).forEach(function (e) {
      if (!exist[e.id]) state.errors.push(Object.assign({ seed: true }, e));
    });
    state.flags.demo = true;
    save();
    return state;
  }

  /* 连续天数：每天第一次学习时推进 */
  function touchDay() {
    var t = today();
    var st = state.stats;
    if (st.lastDay === t) return;
    if (st.lastDay && daysBetween(st.lastDay, t) === 1) st.streak += 1;
    else if (!st.lastDay || daysBetween(st.lastDay, t) > 1) st.streak = 1;
    st.lastDay = t;
    if (st.days.indexOf(t) < 0) st.days.push(t);
    if (st.days.length > 120) st.days = st.days.slice(-120);
    save();
  }

  function logEvent(type, title, detail) {
    state.events.unshift({ id: uid('ev'), ts: Date.now(), type: type, title: title, detail: detail || '' });
    state.events = state.events.slice(0, 80);
    touchDay();
    save();
  }

  function addMinutes(n) {
    state.stats.minutes += n;
    save();
  }

  /* ---------------- RAG：切块 + BM25 ---------------- */
  var INDEX = null;
  var SYN = {
    '作文': ['写作', 'writing', '评分', 'essay'],
    '写作': ['作文', 'writing', 'essay'],
    '听力': ['listening', '听', '对话'],
    '翻译': ['translation', '译'],
    '单词': ['词汇', 'word', '背'],
    '词汇': ['单词', 'word'],
    '长难句': ['句子', '从句', 'sentence'],
    '语法': ['从句', 'grammar', '结构'],
    '错题': ['复盘', '错误', 'review'],
    '模拟': ['模考', '考试', '分数'],
    '阅读': ['reading', '定位'],
    '计划': ['规划', '安排', 'plan']
  };

  function tokenize(s) {
    var out = [];
    var lower = String(s || '').toLowerCase();
    var en = lower.match(/[a-z][a-z'-]{1,}/g) || [];
    out = out.concat(en);
    var zh = lower.match(/[\u4e00-\u9fa5]+/g) || [];
    zh.forEach(function (seg) {
      for (var i = 0; i < seg.length - 1; i++) out.push(seg.slice(i, i + 2));
      if (seg.length === 1) out.push(seg);
    });
    return out;
  }

  function buildIndex() {
    if (INDEX) return INDEX;
    var docs = (window.KB_DOCS || []).concat(window.KB_EXTRA || []);
    var chunks = [];
    docs.forEach(function (d) {
      var paras = String(d.text || '').split(/\n{2,}/).map(function (x) { return x.trim(); }).filter(Boolean);
      var buf = '';
      paras.forEach(function (p) {
        if (buf && (buf.length + p.length) > 260) { chunks.push({ doc: d, text: buf }); buf = p; }
        else buf = buf ? buf + '\n' + p : p;
      });
      if (buf) chunks.push({ doc: d, text: buf });
    });
    chunks.forEach(function (c, i) {
      c.id = c.doc.id + '#' + i;
      c.toks = tokenize(c.doc.title + ' ' + c.doc.title + ' ' + c.doc.tags.join(' ') + ' ' + c.text);
      c.tf = {};
      c.toks.forEach(function (t) { c.tf[t] = (c.tf[t] || 0) + 1; });
      c.len = c.toks.length;
    });
    var df = {};
    chunks.forEach(function (c) { Object.keys(c.tf).forEach(function (t) { df[t] = (df[t] || 0) + 1; }); });
    var avg = chunks.reduce(function (s, c) { return s + c.len; }, 0) / Math.max(1, chunks.length);
    INDEX = { chunks: chunks, df: df, avg: avg, N: chunks.length, totalDocs: docs.length };
    return INDEX;
  }

  function expandQuery(q) {
    var toks = tokenize(q);
    var extra = [];
    Object.keys(SYN).forEach(function (k) {
      if (q.indexOf(k) >= 0) extra = extra.concat(SYN[k]);
    });
    return { toks: toks, all: uniq(toks.concat(extra)) };
  }

  function searchKB(query, k) {
    k = k || 6;
    var idx = buildIndex();
    var q = expandQuery(query);
    var qset = uniq(q.all);
    if (!qset.length) return [];
    var k1 = 1.5, b = 0.75;
    var res = idx.chunks.map(function (c) {
      var score = 0, matched = [];
      qset.forEach(function (t) {
        var tf = c.tf[t];
        if (!tf) return;
        var dfv = idx.df[t] || 0;
        var idf = Math.log(1 + (idx.N - dfv + 0.5) / (dfv + 0.5));
        score += idf * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * c.len / idx.avg));
        matched.push(t);
      });
      return { chunk: c, score: score, matched: matched };
    }).filter(function (r) { return r.score > 0; })
      .sort(function (a, b2) { return b2.score - a.score; })
      .slice(0, k);

    if (!res.length) {
      // 未命中：回退到标题/分类模糊匹配
      var qq = norm(query);
      res = idx.chunks.filter(function (c) {
        return norm(c.doc.title + c.doc.tags.join(' ')).indexOf(qq.slice(0, 6)) >= 0;
      }).slice(0, k).map(function (c) { return { chunk: c, score: 0.05, matched: [] }; });
    }
    return res.map(function (r) {
      return {
        id: r.chunk.id,
        docId: r.chunk.doc.id,
        title: r.chunk.doc.title,
        source: r.chunk.doc.source,
        category: r.chunk.doc.category,
        tags: r.chunk.doc.tags,
        text: r.chunk.text,
        score: round(r.score, 2),
        matched: uniq(r.matched)
      };
    });
  }

  function kbStats() {
    var idx = buildIndex();
    return { docs: idx.totalDocs, chunks: idx.chunks.length, terms: Object.keys(idx.df).length };
  }

  /* ---------------- 单词 / SRS ---------------- */
  function dueWords() {
    var t = today();
    return (window.CET4_WORDS || []).filter(function (w) {
      var r = state.srs[w.id];
      return r && r.due <= t;
    });
  }

  function pickWords(n, tag) {
    n = n || 4;
    var t = today();
    var due = [], fresh = [], known = {};
    (window.CET4_WORDS || []).forEach(function (w) {
      var r = state.srs[w.id];
      if (r) {
        known[w.id] = 1;
        if (r.due <= t) due.push(w);
      } else fresh.push(w);
    });
    due.sort(function (a, b) { return state.srs[a.id].due.localeCompare(state.srs[b.id].due); });
    var weak = weakTags().map(function (x) { return x.tag; });
    fresh.sort(function (a, b) {
      var sa = (a.tags || []).filter(function (x) { return weak.indexOf(x) >= 0; }).length;
      var sb = (b.tags || []).filter(function (x) { return weak.indexOf(x) >= 0; }).length;
      return sb - sa;
    });
    var list = due.concat(fresh);
    if (tag) {
      var f = list.filter(function (w) { return (w.tags || []).indexOf(tag) >= 0; });
      if (f.length >= n) list = f;
    }
    return list.slice(0, n);
  }

  function scheduleWord(id, rating) {
    var t = today();
    var r = state.srs[id];
    if (!r) r = { ease: 2.5, interval: 0, reps: 0, lapses: 0, due: t, seen: 0, correct: 0 };
    r.seen += 1;
    if (rating === 'again') {
      r.ease = clamp(r.ease - 0.2, 1.3, 2.8);
      r.interval = 0;
      r.due = t;
      r.lapses += 1;
    } else {
      var mult = rating === 'hard' ? 1.2 : rating === 'easy' ? 1.35 : 1;
      if (rating === 'hard') r.ease = clamp(r.ease - 0.15, 1.3, 2.8);
      if (rating === 'easy') r.ease = clamp(r.ease + 0.1, 1.3, 2.8);
      r.interval = r.interval ? Math.max(1, Math.round(r.interval * r.ease * mult)) : (rating === 'easy' ? 2 : 1);
      r.due = addDays(t, r.interval);
      r.reps += 1;
      if (rating !== 'hard') r.correct += 1;
    }
    state.srs[id] = r;
    save();
    return r;
  }

  function recordAnswer(q, ok) {
    state.stats.answered += 1;
    if (ok) state.stats.correct += 1;
    var tag = q.tag || q.type || '综合';
    var t = state.stats.byTag[tag] || { n: 0, ok: 0 };
    t.n += 1; if (ok) t.ok += 1;
    state.stats.byTag[tag] = t;
    if (!ok) {
      addError({
        type: q.type || '练习',
        tag: tag,
        q: q.stem,
        userAnswer: q._user || '',
        correct: q.options ? q.options[q.answer] : (q.correct || ''),
        explain: q.explain || '',
        source: '个性化练习'
      });
    }
    touchDay();
    save();
  }

  /* ---------------- 错题 / 弱项 ---------------- */
  function addError(e) {
    var exists = state.errors.some(function (x) { return !x.mastered && norm(x.q) === norm(e.q); });
    if (exists) return;
    state.errors.unshift(Object.assign({
      id: uid('err'),
      date: today(),
      source: '练习',
      mastered: false
    }, e));
    state.errors = state.errors.slice(0, 60);
    save();
  }

  function toggleMastered(id) {
    var e = state.errors.filter(function (x) { return x.id === id; })[0];
    if (e) { e.mastered = !e.mastered; e.date = e.date || today(); save(); }
    return e;
  }

  function weakTags() {
    var map = {};
    state.errors.forEach(function (e) {
      if (e.mastered) return;
      map[e.tag] = map[e.tag] || { tag: e.tag, errors: 0, acc: null, n: 0 };
      map[e.tag].errors += 1;
    });
    Object.keys(state.stats.byTag).forEach(function (tag) {
      var b = state.stats.byTag[tag];
      map[tag] = map[tag] || { tag: tag, errors: 0, acc: null, n: 0 };
      map[tag].n = b.n;
      map[tag].acc = b.n ? b.ok / b.n : null;
    });
    return Object.keys(map).map(function (k) {
      var x = map[k];
      var score = x.errors * 2 + (x.acc == null ? 0.4 : (1 - x.acc) * 3) + (x.n < 2 ? 0.3 : 0);
      return { tag: x.tag, errors: x.errors, acc: x.acc, n: x.n, score: round(score, 2) };
    }).sort(function (a, b) { return b.score - a.score; });
  }

  function errorStats() {
    var active = state.errors.filter(function (e) { return !e.mastered; });
    var byTag = {};
    active.forEach(function (e) { byTag[e.tag] = (byTag[e.tag] || 0) + 1; });
    return { total: state.errors.length, active: active.length, mastered: state.errors.length - active.length, byTag: byTag };
  }

  function pickPractice(opts) {
    opts = opts || {};
    var n = opts.n || 5;
    var weak = weakTags().slice(0, 4).map(function (x) { return x.tag; });
    var tags = opts.tags || weak;
    var types = opts.types || null;
    var bank = (window.PRACTICE_BANK || []).slice();
    var scored = bank.map(function (q) {
      var s = Math.random();
      if (tags.indexOf(q.tag) >= 0) s += 3;
      if (q.tag && errorStats().byTag[q.tag]) s += 1;
      if (types && types.indexOf(q.type) >= 0) s += 1.5;
      return { q: q, s: s };
    }).sort(function (a, b) { return b.s - a.s; });
    var seen = {}, out = [];
    scored.forEach(function (x) {
      if (out.length >= n) return;
      if (seen[x.q.id]) return;
      seen[x.q.id] = 1;
      out.push(x.q);
    });
    return { questions: out, tags: tags };
  }

  /* ---------------- 作文批改 ---------------- */
  var TRANSITIONS = ['however', 'moreover', 'furthermore', 'therefore', 'in addition', 'what is more', 'first', 'second', 'finally', 'in conclusion', 'on the one hand', 'on the other hand', 'as a result', 'for example', 'for instance', 'besides', 'nevertheless', 'consequently', 'to begin with', 'last but not least'];
  var VOWELS = /^[aeiou]/;
  var A_EXCEPT = ['university', 'universities', 'user', 'users', 'unique', 'unit', 'uniform', 'useful', 'usual', 'european', 'one', 'once'];
  var AN_EXCEPT = ['hour', 'hours', 'honest', 'honor', 'honour', 'heir'];

  function gradeEssay(text, promptId) {
    text = String(text || '').trim();
    var prompt = (window.WRITING_PROMPTS || []).filter(function (p) { return p.id === promptId; })[0] || (window.WRITING_PROMPTS || [])[0] || null;
    var minWords = prompt ? prompt.minWords : 120;
    var words = text.match(/[A-Za-z][A-Za-z'-]*/g) || [];
    var wc = words.length;
    var sents = text.split(/[.!?]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 2; });
    var paras = text.split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var lower = ' ' + text.toLowerCase() + ' ';
    var issues = [], upgrades = [], credits = [];

    if (wc < minWords * 0.8) issues.push({ type: '内容', msg: '字数不足（' + wc + ' 词，题目要求约 ' + minWords + ' 词），内容展开不充分。', quote: '', suggest: '每个主体段补一个具体例子或结果，至少写满 ' + minWords + ' 词。' });
    if (paras.length < 3) issues.push({ type: '结构', msg: '只有 ' + paras.length + ' 段，缺少“引入—展开—收束”的层次。', quote: '', suggest: '拆成 3 段：现象/观点 → 两个理由 → 总结建议。' });

    var usedTrans = TRANSITIONS.filter(function (t) { return lower.indexOf(' ' + t + ' ') >= 0; });
    if (usedTrans.length < 2) issues.push({ type: '衔接', msg: '逻辑连接词偏少（检测到 ' + usedTrans.length + ' 个），段落之间靠内容硬接。', quote: '', suggest: '在段首补 What is more / Therefore / In conclusion 等，让论证关系显性化。' });

    // 写作升级替换
    (window.WRITING_UPGRADES || []).forEach(function (u) {
      var from = u[0], to = u[1];
      var re = new RegExp('(^|[^a-z])' + from.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)', 'i');
      if (re.test(text)) upgrades.push({ from: from, to: to, used: false });
      else {
        var re2 = new RegExp('(^|[^a-z])' + to.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z]|$)', 'i');
        if (re2.test(text)) credits.push(to);
      }
    });

    // 语法启发式检查
    var aRe = /\ba\s+([a-z]+)/gi, m;
    while ((m = aRe.exec(text))) {
      var w = m[1].toLowerCase();
      if (VOWELS.test(w) && A_EXCEPT.indexOf(w) < 0) {
        issues.push({ type: '语法', msg: '冠词错误：' + w + ' 以元音音素开头，应用 an。', quote: m[0], suggest: 'a ' + w + ' → an ' + w });
      }
    }
    var anRe = /\ban\s+([a-z]+)/gi;
    while ((m = anRe.exec(text))) {
      var w2 = m[1].toLowerCase();
      if (!VOWELS.test(w2) && AN_EXCEPT.indexOf(w2) < 0) {
        issues.push({ type: '语法', msg: '冠词错误：' + w2 + ' 以辅音音素开头，应用 a。', quote: m[0], suggest: 'an ' + w2 + ' → a ' + w2 });
      }
    }
    var agree = [/\b(people|students|they|we|you)\s+(is|was)\b/gi, /\b(he|she|it)\s+(are|were)\b/gi, /\bthe number of\b[^.]{0,40}\b(are|were)\b/gi];
    agree.forEach(function (re) {
      var mm;
      while ((mm = re.exec(text))) issues.push({ type: '语法', msg: '主谓一致存疑：' + mm[0] + '。', quote: mm[0], suggest: '检查主语单复数，谓语与真正的主语一致。' });
    });

    var bad = [
      { re: /\bdiscuss\s+about\b/gi, msg: 'discuss 是及物动词，后面不加 about。', sug: 'discuss about → discuss' },
      { re: /\baccording to me\b/gi, msg: 'according to 不用于引出自己的观点。', sug: 'according to me → in my view' },
      { re: /\bmore better\b/gi, msg: '比较级重复。', sug: 'more better → better' },
      { re: /\bcan able to\b/gi, msg: '情态动词重复。', sug: 'can able to → can' },
      { re: /\bI think\b/gi, msg: 'I think 略显口语化，写作中可升级。', sug: 'I think → From my perspective' },
      { re: /\bvery\s+(important|big|good|bad|happy|difficult)\b/gi, msg: 'very + 形容词偏初级。', sug: 'very important → of great importance / crucial' }
    ];
    bad.forEach(function (r) {
      var mm;
      while ((mm = r.re.exec(text))) {
        issues.push({ type: '语言', msg: r.msg, quote: mm[0], suggest: r.sug });
      }
    });

    // 长句 & 重复
    sents.forEach(function (s) {
      var n = (s.match(/[A-Za-z][A-Za-z'-]*/g) || []).length;
      if (n > 38) issues.push({ type: '语言', msg: '单句 ' + n + ' 词，信息密度过高，考场上容易失控。', quote: s.slice(0, 60) + '…', suggest: '在从句或并列处断成两句，每句 15–25 词。' });
    });

    var freq = {};
    words.forEach(function (w) { w = w.toLowerCase(); if (w.length > 4) freq[w] = (freq[w] || 0) + 1; });
    var top = Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; })[0];
    if (top && freq[top] >= 5 && wc > 40) {
      issues.push({ type: '语言', msg: '“' + top + '”重复 ' + freq[top] + ' 次，词汇变化不足。', quote: top, suggest: '用同义表达替换其中 2–3 处，如 ' + (top === 'important' ? 'crucial / vital / significant' : '换用近义词或调整句式') + '。' });
    }

    var advanced = words.filter(function (w) {
      var lw = w.toLowerCase();
      return lw.length >= 8 && ['important', 'because', 'students', 'people'].indexOf(lw) < 0;
    });
    var advRatio = words.length ? advanced.length / words.length : 0;

    var content = clamp(17 + Math.min(7, (wc / Math.max(1, minWords)) * 6) + (credits.length ? 1 : 0) - (wc < minWords * 0.8 ? 4 : 0), 8, 25);
    var structure = clamp(14 + (paras.length >= 3 ? 6 : paras.length * 2) + (/\n/.test(text) ? 1 : 0) + (sents.length >= 6 ? 2 : 0), 8, 25);
    var language = clamp(15 + Math.min(5, advRatio * 55) + Math.min(3, credits.length) - issues.filter(function (i) { return i.type === '语法' || i.type === '语言'; }).length * 0.9, 7, 25);
    var cohesion = clamp(13 + Math.min(7, usedTrans.length * 2) + (upgrades.length === 0 ? 2 : 0) + (credits.length ? 2 : 0), 7, 25);
    var total = round(content + structure + language + cohesion, 1);
    var cet = round(total * 1.065, 1);
    var band = total >= 85 ? '优秀' : total >= 72 ? '良好' : total >= 60 ? '及格' : '待提升';

    // 去重 issue
    var seen = {};
    issues = issues.filter(function (i) {
      var k = i.type + '|' + i.msg;
      if (seen[k]) return false; seen[k] = 1; return true;
    }).slice(0, 8);

    // 可借鉴的范文表达
    var borrow = [];
    if (prompt && prompt.model) {
      var ms = prompt.model.split(/[.!?]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 20; });
      borrow = ms.slice(0, 3);
    }

    return {
      prompt: prompt,
      wordCount: wc,
      sentences: sents.length,
      paragraphs: paras.length,
      dims: [
        { name: '内容', score: round(content, 1), note: wc >= minWords ? '任务完成度较好' : '需要补足细节' },
        { name: '结构', score: round(structure, 1), note: paras.length >= 3 ? '三段式清晰' : '段落层次不足' },
        { name: '语言', score: round(language, 1), note: '语法与词汇综合' },
        { name: '衔接', score: round(cohesion, 1), note: '连接词 ' + usedTrans.length + ' 个' }
      ],
      score: total,
      cet: cet,
      band: band,
      issues: issues,
      upgrades: upgrades.slice(0, 5),
      credits: uniq(credits).slice(0, 5),
      transitions: usedTrans,
      borrow: borrow,
      minWords: minWords
    };
  }

  /* ---------------- 翻译评分 ---------------- */
  function gradeTranslation(text, itemId) {
    text = String(text || '').trim();
    var item = (window.TRANSLATIONS || []).filter(function (t) { return t.id === itemId; })[0] || (window.TRANSLATIONS || [])[0];
    if (!item) return null;
    var nt = norm(text);
    var hits = [], miss = [];
    (item.phrases || []).forEach(function (p) {
      var forms = [p.en].concat(p.alts || []);
      var ok = forms.some(function (f) { var nf = norm(f); return nf && nt.indexOf(nf) >= 0; });
      if (ok) hits.push(p); else miss.push(p);
    });
    var refWords = (item.ref.match(/[A-Za-z][A-Za-z'-]*/g) || []).length;
    var myWords = (text.match(/[A-Za-z][A-Za-z'-]*/g) || []).length;
    var ratio = refWords ? myWords / refWords : 0;
    var lenScore = clamp(1 - Math.abs(1 - ratio) * 1.3, 0, 1);
    var coverage = item.phrases && item.phrases.length ? hits.length / item.phrases.length : 0;
    var score = text ? Math.round(coverage * 62 + lenScore * 23 + (myWords > 6 ? 15 : 6)) : 0;
    score = clamp(score, 0, 100);
    var feedback = [];
    if (coverage < 0.6) feedback.push('关键短语只覆盖 ' + hits.length + '/' + (item.phrases || []).length + '，丢分主要在这里。');
    if (ratio < 0.75) feedback.push('译文偏短（' + myWords + ' 词 / 参考 ' + refWords + ' 词），可能有信息漏译。');
    if (ratio > 1.35) feedback.push('译文偏长，可能有重复表达或直译堆砌。');
    if (!feedback.length) feedback.push('关键信息完整，长度合适；下一步打磨语序与搭配。');
    return {
      item: item,
      text: text,
      score: score,
      hits: hits,
      miss: miss,
      refWords: refWords,
      myWords: myWords,
      feedback: feedback,
      ref: item.ref,
      tips: item.tips || []
    };
  }

  /* ---------------- 模拟卷分析 ---------------- */
  function analyzeMock() {
    var m = window.MOCK;
    var total = m.sections.reduce(function (s, x) { return s + x.score; }, 0);
    var full = m.sections.reduce(function (s, x) { return s + x.full; }, 0);
    var rows = m.sections.map(function (s) {
      return { key: s.key, name: s.name, score: s.score, full: s.full, rate: round(s.score / s.full * 100, 1), lost: round(s.full - s.score, 1) };
    }).sort(function (a, b) { return a.rate - b.rate; });
    var weakest = rows[0];
    var hist = m.history || [];
    var trend = hist.length >= 2 ? hist[hist.length - 1].total - hist[hist.length - 2].total : 0;

  /* ---------------- 长难句：匹配 / 通用拆解 ---------------- */
  function matchSentence(q) {
    var list = window.LONG_SENTENCES || [];
    var nq = norm(q);
    var best = null, bestScore = 0;
    list.forEach(function (s) {
      var ns = norm(s.text);
      var words = nq.split(' ').filter(function (w) { return w.length > 3; });
      var hit = words.filter(function (w) { return ns.indexOf(w) >= 0; }).length;
      var sc = hit / Math.max(1, words.length);
      if (ns === nq) sc = 9;
      if (sc > bestScore) { bestScore = sc; best = s; }
    });
    return bestScore >= 0.5 ? best : null;
  }

  var CLAUSE_MAP = [
    { re: /\b(which|that|who|whom|whose)\b/i, name: '定语从句', note: '连接词在从句中作主语/宾语/定语，先划出先行词。' },
    { re: /\b(because|since|as|although|though|if|unless|when|while|before|after|until|once)\b/i, name: '状语从句', note: '连接词表明逻辑关系（原因/让步/条件/时间），从句不能单独成句。' },
    { re: /\b(what|whether|that|if)\b/i, name: '名词性从句', note: '整个从句充当主语、宾语或表语，注意语序用陈述句。' },
    { re: /\b(to\s+\w+|doing|done)\b/i, name: '非谓语', note: '一个句子只有一个谓语动词，其余动词要变成 to do / doing / done。' }
  ];

  function heuristicParse(text) {
    var raw = String(text || '').trim();
    var parts = raw.split(/(?<=,)\s+|\s+(?=(?:which|that|who|because|although|though|if|when|while|where|whose)\b)/i).filter(Boolean);
    var segments = parts.map(function (p, i) {
      var k = 'main';
      if (/\b(which|that|who|whom|whose|where|when)\b/i.test(p) && i > 0) k = 'clause';
      else if (/\b(because|although|though|if|unless|when|while|before|after|since|as)\b/i.test(p) && i > 0) k = 'mod';
      else if (i > 0) k = 'prep';
      return { t: p, k: k, n: '' };
    });
    var found = [];
    CLAUSE_MAP.forEach(function (c) {
      if (c.re.test(raw)) found.push({ title: c.name, body: c.note, eg: (raw.match(c.re) || [''])[0] });
    });
    if (!found.length) found.push({ title: '主干优先', body: '先找谓语动词，再找它前面的主语；剩下的介词短语、从句都是修饰成分。', eg: '' });
    return {
      id: 'custom',
      source: '你的句子',
      level: 3,
      tags: ['通用拆解'],
      text: raw,
      translation: '',
      skeleton: '先圈谓语 → 定主语 → 把从句/介词短语折叠成修饰块',
      segments: segments,
      points: found,
      vocab: []
    };
  }

  /* ---------------- 可选 LLM ---------------- */
  async function callLLM(messages, opts) {
    opts = opts || {};
    var cfg = state.settings.llm;
    var _lc = window.CET4_LLM_CONFIG || {};
    var bridge = String(_lc.bridgeUrl || '').replace(/\/+$/, '');
    var sharecode = String(_lc.sharecode || '');
    var useBridge = !!bridge && !cfg.apiKey;
    if (!cfg.apiKey && !useBridge) throw new Error('NO_KEY');

    var url = useBridge
      ? bridge + '/api/chat' + (sharecode ? '?sharecode=' + encodeURIComponent(sharecode) : '')
      : cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions';
    var headers = { 'Content-Type': 'application/json' };
    if (!useBridge) headers['Authorization'] = 'Bearer ' + cfg.apiKey;

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, opts.timeout || 20000);
    try {
      var payload = {
        model: cfg.model || 'deepseek-chat',
        messages: messages,
        temperature: opts.temperature == null ? 0.6 : opts.temperature
      };
      if (opts.maxTokens) payload.max_tokens = opts.maxTokens;
      if (opts.json) payload.response_format = { type: 'json_object' };
      var r = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(payload),
        signal: ctrl.signal
      });
      if (!r.ok) {
        var msg = 'HTTP ' + r.status;
        try { var ej = await r.json(); if (ej && ej.error && ej.error.message) msg = ej.error.message; } catch (e2) {}
        throw new Error(msg);
      }
      var j = await r.json();
      var content = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      if (!content) throw new Error('EMPTY');
      if (opts.raw) return { content: content, usage: j.usage || null, model: j.model || payload.model };
      return content;
    } finally { clearTimeout(timer); }
  }

  /* ---------------- Agent：意图 → 计划 → 执行 ---------------- */
  function detectIntent(q) {
    var s = String(q || '');
    var low = s.toLowerCase();
    var scores = { words: 0, sentence: 0, listening: 0, writing: 0, translation: 0, review: 0, mock: 0, practice: 0, plan: 0, knowledge: 0 };
    function add(k, n) { scores[k] += n; }
    if (/作文|写作|批改|essay|writing/i.test(s)) add('writing', 3);
    if (/翻译|译文|translat/i.test(s)) add('translation', 3);
    if (/听力|精听|listening|对话|新闻|篇章/i.test(s)) add('listening', 3);
    if (/长难句|句子|解析|structure|sentence/i.test(s)) add('sentence', 3);
    if (/从句|语法/i.test(s)) add('sentence', 2);
    if (/单词|词汇|背|word|vocab|记忆卡/i.test(s)) add('words', 3);
    if (/错题|复盘|错误|review/i.test(s)) add('review', 3);
    if (/薄弱点|弱项|薄弱环节/i.test(s)) add('review', 3.5);
    if (/模拟|模考|分数|成绩|试卷|mock|score/i.test(s)) add('mock', 3);
    if (/计划|规划|安排|今天学什么|怎么复习|plan/i.test(s)) add('plan', 3);
    if (/练习|做题|出题|测|quiz|practice/i.test(s)) add('practice', 3);
    if (/什么是|是什么|为什么|如何理解|怎么理解|区分|区别|用法|技巧|方法|标准|介绍|讲讲/i.test(s)) add('knowledge', 3.2);
    if (/怎么|如何/i.test(s)) add('knowledge', 1.5);
    if (s.length > 120) add('writing', 0.5);
    if (/\b(which|that|who|although|because)\b/i.test(s) && s.split(/\s+/).length > 8) add('sentence', 1.5);
    var best = 'knowledge', bv = 0.9;
    Object.keys(scores).forEach(function (k) { if (scores[k] > bv) { bv = scores[k]; best = k; } });
    return best;
  }

        var nq = norm(zhMatch[0]);
        var best = null, bs = 0;
        (window.TRANSLATIONS || []).forEach(function (t) {
          var nt = norm(t.zh);
          var common = 0;
          for (var i = 0; i < Math.min(nq.length, nt.length); i++) if (nq[i] === nt[i]) common++;
          var sc = common / Math.max(nq.length, nt.length);
          if (sc > bs) { bs = sc; best = t; }
        });
        item = bs > 0.45 ? best : null;
      }
      if (!item) item = (window.TRANSLATIONS || [])[0];
      done(plan.steps[1], item.title + '：' + (item.phrases || []).length + ' 个关键短语');
      var tr = gradeTranslation('', item.id);
      done(plan.steps[2], '已载入参考译文，等待你的译文');
      blocks.push({ type: 'text', text: '翻译题：**' + item.zh + '**\n\n先自己写一版，再点「对照评分」。四级翻译按信息点给分，关键词丢一个就是 1–2 分。' });
      blocks.push({ type: 'translation', item: item, result: null });
      blocks.push({ type: 'cites', cites: kb5.slice(0, 2) });
      cites = kb5;
    }

    // 6. 错题
    else if (intent === 'review') {
      var es = errorStats();
      done(plan.steps[0], '错题 ' + es.total + ' 道，未掌握 ' + es.active + '，已掌握 ' + es.mastered);
      done(plan.steps[1], '共 ' + Object.keys(es.byTag).length + ' 类：' + Object.keys(es.byTag).slice(0, 4).map(function (k) { return k + '×' + es.byTag[k]; }).join('、'));
      var pq = pickPractice({ n: 3, tags: weakTags().slice(0, 2).map(function (x) { return x.tag; }) });
      done(plan.steps[2], '变式题 ' + pq.questions.length + ' 道');
      blocks.push({ type: 'text', text: '错题本里还有 **' + es.active + ' 道** 没掌握。先按标签看归因，再做 3 道同标签变式题——做对后我会把原错题标成已掌握。' });
      blocks.push({ type: 'errors', errors: state.errors.slice(0, 6) });
      blocks.push({ type: 'practice', questions: pq.questions, tags: pq.tags });
    }

    // 7. 模拟卷
    else if (intent === 'mock') {
      if (!state.flags || state.flags.demo === false) {
        done(plan.steps[0], '暂无真实模考记录');
        blocks.push({ type: 'text', text: '还没有你的模考记录。示例数据已清空，我不会拿预置的分数当你的成绩。做完一套真题后，把写作 / 听力 / 阅读 / 翻译四个分项的分数告诉我，我按 710 分制拆开分析，找出最该补的那一块。' });
        blocks.push({ type: 'plan', plan: buildPlan(1) });
      } else {
        done(plan.steps[0], '最近一次 ' + (window.MOCK.history.slice(-1)[0] || {}).total + ' 分（示例）');
        var a = analyzeMock();
        done(plan.steps[1], '总分 ' + a.total + ' / 710（四级口径），得分率 ' + a.rate + '%');
        done(plan.steps[2], '最弱：' + a.weakest.name + '（' + a.weakest.rate + '%），差目标 ' + a.gap + ' 分');
        blocks.push({ type: 'text', text: '最近一次 **' + a.total + ' / 710**，离目标 ' + a.target + ' 还差 **' + a.gap + ' 分**。失分最重的是 ' + a.weakest.name + '（丢 ' + a.weakest.lost + ' 分）。\n\n> 这份成绩来自内置示例数据，不是你的真实记录。' });
        blocks.push({ type: 'mock', analysis: a });
        blocks.push({ type: 'plan', plan: buildPlan(1) });
      }
    }

    // 8. 练习
    else if (intent === 'practice') {
      var weak = weakTags().slice(0, 3);
      done(plan.steps[0], '薄弱标签：' + weak.map(function (x) { return x.tag; }).join('、'));
      var set2 = opts.questions ? { questions: opts.questions, tags: opts.tags || [] } : pickPractice({ n: 5 });
      done(plan.steps[1], set2.questions.length + ' 题，覆盖 ' + uniq(set2.questions.map(function (q) { return q.tag; })).join('、'));
      blocks.push({ type: 'text', text: '按你的弱项组了 **' + set2.questions.length + ' 题**。做完点「提交」，错题会自动进错题本并更新画像。' });
      blocks.push({ type: 'practice', questions: set2.questions, tags: set2.tags });
    }

    // 9. 计划
    else if (intent === 'plan') {
      var p = buildPlan(1);
      done(plan.steps[0], '目标 ' + state.profile.target + '，距考试 ' + Math.max(0, daysBetween(today(), state.profile.examDate)) + ' 天');
      done(plan.steps[1], p.tasks.length + ' 项任务 / 约 ' + p.totalMin + ' 分钟');
      blocks.push({ type: 'text', text: '今天重点放在 **' + p.focus + '**。任务按“最弱项 → 到期复习 → 保持项”排，预计 ' + p.totalMin + ' 分钟；点任务可以直接跳转。' });
      blocks.push({ type: 'plan', plan: p });
    }

    // 10. 知识问答
    else {
      var k = answerKnowledge(message);
      done(plan.steps[0], (k.cites[0] ? '“' + k.cites[0].title + '” 得分 ' + k.cites[0].score : '无命中'));
      done(plan.steps[1], '已读取画像：' + state.profile.name + '，连续 ' + state.stats.streak + ' 天');
      blocks = blocks.concat(k.blocks);
      cites = k.cites;
    }

    // LLM 增强（仅知识问答，且配置了 key）：用 LLM 改写本地答案，引用块保留
    if (!opts.noLLM && state.settings.llm.apiKey && (intent === 'knowledge' || opts.forceLLM)) {
      var llmIdx = -1;
      for (var bi = 0; bi < blocks.length; bi++) if (blocks[bi].type === 'text') { llmIdx = bi; break; }
      if (llmIdx < 0) { blocks.push({ type: 'text', text: '' }); llmIdx = blocks.length - 1; }
      try {
        var sys = '你是四级备考助教。用简体中文回答，先给结论，再给可执行步骤。只使用短段落、小标题（###）和短列表；不要使用 Markdown 表格、水平分隔线、代码块或表情。参考以下本地知识库片段：\n' +
          cites.slice(0, 3).map(function (c) { return '【' + c.title + '】' + c.text.slice(0, 300); }).join('\n');
        var out = await callLLM([{ role: 'system', content: sys }, { role: 'user', content: message }]);
        blocks[llmIdx] = { type: 'text', text: out, tag: 'LLM' };
        trace.push(toolTrace('llm_chat', '模型 ' + state.settings.llm.model + ' 返回 ' + out.length + ' 字', Date.now() - t0));
      } catch (e) {
        // 失败时保留本地答案，只在轨迹里记录，不破坏页面
        trace.push(toolTrace('llm_chat', '失败，已回退本地：' + e.message, Date.now() - t0));
      }
    }

    // 收尾：事件与聊天记忆
    state.chat.unshift({ role: 'user', text: message, ts: Date.now() });
    state.chat.unshift({ role: 'agent', text: (blocks[0] && blocks[0].text ? blocks[0].text : '已生成结果').slice(0, 160), ts: Date.now() });
    state.chat = state.chat.slice(0, 24);
    logEvent('chat', 'Agent 处理：' + message.slice(0, 28), plan.intent + ' · ' + trace.length + ' 次工具调用');
    save();

    return { intent: intent, plan: plan, trace: trace, blocks: blocks, cites: cites, usedLLM: !!state.settings.llm.apiKey, ms: Date.now() - t0 };
  }

  /* ---------------- 对外 API ---------------- */
  window.Engine = {
    get state() { return state; },
    save: save,
    reset: reset,
    isDemo: isDemo,
    seedErrorCount: seedErrorCount,
    clearDemo: clearDemo,
    restoreDemo: restoreDemo,
    today: today,
    addDays: addDays,
    daysBetween: daysBetween,
    escape: esc,
    norm: norm,
    round: round,
    uid: uid,
    logEvent: logEvent,
    addMinutes: addMinutes,
    streak: function () { return state.stats.streak; },
    dueCount: function () { return dueWords().length; },
    dueWords: dueWords,
    pickWords: pickWords,
    scheduleWord: scheduleWord,
    recordAnswer: recordAnswer,
    addError: addError,
    toggleMastered: toggleMastered,
    weakTags: weakTags,
    errorStats: errorStats,
    pickPractice: pickPractice,
    searchKB: searchKB,
    kbStats: kbStats,
    gradeEssay: gradeEssay,
    gradeTranslation: gradeTranslation,
    analyzeMock: analyzeMock,
    buildPlan: buildPlan,
    todayPlan: todayPlan,
    toggleTask: toggleTask,
    matchSentence: matchSentence,
    heuristicParse: heuristicParse,
    pickListening: pickListening,
    tools: TOOLS,
    chat: chat,
    detectIntent: detectIntent,
    callLLM: callLLM,
    testLLM: testLLM,
    stats: function () {
      var learned = Object.keys(state.srs).length;
      var mastered = state.errors.filter(function (e) { return e.mastered; }).length;
      return {
        learned: learned,
        totalWords: (window.CET4_WORDS || []).length,
        due: dueWords().length,
        streak: state.stats.streak,
        answered: state.stats.answered,
        accuracy: state.stats.answered ? Math.round(state.stats.correct / state.stats.answered * 100) : 0,
        errors: state.errors.filter(function (e) { return !e.mastered; }).length,
        mastered: mastered,
        minutes: state.stats.minutes,
        daysToExam: Math.max(0, daysBetween(today(), state.profile.examDate))
      };
    }
  };
})();

</script>
<script>
/* assets/js/l2-agent.js */
/* ============================================================
   四级智备 · L2 Agent（LLM 驱动的理解层）
   ------------------------------------------------------------
   原来的链路：正则打分 → 固定分支 → 套用模板文案
   现在的链路：
     ① 规划：模型读「用户原话 + 学习记忆快照」，判定意图 / 情绪 / 依据
     ② 取证：按模型给出的检索词跑本地 BM25，拿到可溯源片段
     ③ 执行：复用原有确定性工具管线（分数、选词、组卷全由代码算）
     ④ 生成：模型拿着「工具产出的事实清单」写回复，禁止编造数字
   设计原则：LLM 负责「理解」与「表达」，计算与数据留在本地代码里。
   模型不可用时整条链路回退到本地规则引擎，页面不会坏。
   ============================================================ */
(function () {
  'use strict';

  var E = window.Engine;
  if (!E) return;

  var INTENTS = ['words', 'sentence', 'listening', 'writing', 'translation', 'review', 'mock', 'practice', 'plan', 'knowledge', 'coach'];

  function uniq(a) {
    var seen = {};
    return a.filter(function (x) { if (seen[x]) return false; seen[x] = 1; return true; });
  }

  var INTENT_LABEL = {
    words: '单词与记忆卡',
    sentence: '长难句拆解',
    listening: '听力精讲',
    writing: '作文批改',
    translation: '翻译训练',
    review: '错题复盘',
    mock: '模考诊断',
    practice: '个性化组卷',
    plan: '今日计划',
    knowledge: '知识库问答',
    coach: '陪伴与状态调整'
  };

  /* ---------------- 配置 ---------------- */
  function cfg() {
    var c = window.CET4_LLM_CONFIG || {};
    return {
      bridge: (c.bridgeUrl || '').replace(/\/+$/, ''),
      model: (E.state.settings.llm && E.state.settings.llm.model) || c.model || 'deepseek-chat',
      key: (E.state.settings.llm && E.state.settings.llm.apiKey) || ''
    };
  }

  function enabled() {
    var c = cfg();
    return !!(c.bridge || c.key);
  }

  /* ---------------- 记忆快照：给模型看「你是谁」 ---------------- */
  function snapshot() {
    var st = E.state;
    var s = E.stats();
    var weak = E.weakTags().slice(0, 3).map(function (w) {
      return w.tag + (w.acc == null ? '' : '（正确率 ' + Math.round(w.acc * 100) + '%）') + (w.errors ? '（错 ' + w.errors + ' 题）' : '');
    });
    var mock = null;
    try {
      if (window.MOCK) {
        var a = E.analyzeMock();
        mock = {
          最近总分: a.total,
          目标: a.target,
          差距: a.gap,
          最弱项: a.weakest ? a.weakest.name : '',
          最弱项得分率: a.weakest ? a.weakest.rate : 0,
          趋势: a.trend
        };
      }
    } catch (e) { /* ignore */ }

    var recent = (st.chat || []).slice(0, 6).reverse().map(function (m) {
      return (m.role === 'user' ? '学生：' : '助教：') + String(m.text || '').slice(0, 80);
    });

    return {
      姓名: st.profile.name,
      目标分: st.profile.target,
      距考试天数: s.daysToExam,
      每日可投入分钟: st.profile.dailyMinutes,
      连续学习天数: s.streak,
      已学单词: s.learned + '/' + s.totalWords,
      今日到期复习: s.due,
      累计答题正确率: s.accuracy + '%',
      未掌握错题: s.errors,
      薄弱标签: weak,
      模考: mock,
      最近对话: recent
    };
  }

  /* ---------------- ① 规划 ---------------- */
  var PLAN_SYS = [
    '你是「四级智备」的决策中枢。学生说了一句话，你要判断他真正需要哪个工具，并输出 JSON。',
    '',
    '可选 intent（必须从中选一个）：',
    'words       背单词、复习词汇、记不住词、单词卡',
    'sentence    长难句拆解、从句/非谓语/时态等语法点',
    'listening   听力训练、精听、听力技巧、听力错得多',
    'writing     写作方法；学生贴了英文作文时也选这个',
    'translation 翻译练习、翻译技巧',
    'review      错题复盘、薄弱点诊断、想知道自己哪里差',
    'mock        模考成绩分析、分数诊断、离目标差多少',
    'practice    想做题、要练习、小测、随便来几道',
    'plan        今天学什么、本周怎么安排、时间不够怎么分',
    'knowledge   概念性提问（是什么/为什么/怎么用），需要查知识库',
    'coach       纯情绪表达（想放弃、焦虑、崩溃、没信心），且没有具体任务诉求',
    '',
    '判断规则（按优先级）：',
    '1. 先判断有没有「具体任务诉求」。有 → 选对应工具，情绪只影响表达语气。',
    '2. 没有任何任务诉求，只是宣泄、自我怀疑、想放弃 → coach。',
    '3. 不要因为出现「单词」两个字就选 words。要判断他是想背，还是在说「背单词没用/还要不要背」。',
    '   如果是后者，且带明显情绪 → coach；否则选 knowledge。',
    '4. 学生贴了一段连续英文（5 句以上）→ writing，并把原文放进 essay 字段。',
    '5. 一句话里有多个诉求时，选「最需要立刻给结果」的那个。',
    '6. 含糊到无法判断时，选 knowledge，并把 confidence 设为 0.4 以下。',
    '',
    'emotion 字段（必须填）：none / frustrated（挫败、考砸、就对了几个）/ anxious（焦虑、来不及）/ discouraged（想放弃、没天赋）/ tired（累、撑不住）。',
    '',
    'evidence 字段：为了答好这句话，需要检索哪些知识库关键词，最多 2 个，只写关键词，不要句子。不需要就空数组。',
    '',
    'next 字段：一句话建议学生接下来做什么，具体到可执行（例：先做 3 道听力同义替换）。不要超过 20 字。',
    '',
    'reason 字段：一句话说明你从哪句话判断出来的，要引用学生的原话片段。',
    '',
    '只输出 JSON，不要解释，不要 markdown 代码块。格式：',
    '{"intent":"","confidence":0.0,"emotion":"none","reason":"","evidence":[],"essay":"","next":""}'
  ].join('\n');

  function parseJSON(s) {
    if (!s) return null;
    var t = String(s).trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }

  async function plan(text, snap) {
    var t0 = Date.now();
    var out = await E.callLLM([
      { role: 'system', content: PLAN_SYS },
      { role: 'user', content: '【学习记忆快照】\n' + JSON.stringify(snap, null, 1) + '\n\n【学生这句话】\n' + text }
    ], { json: true, temperature: 0.2, timeout: 15000, maxTokens: 600 });

    var j = parseJSON(out);
    if (!j) throw new Error('规划输出不是合法 JSON');
    var intent = String(j.intent || '').toLowerCase();
    if (INTENTS.indexOf(intent) < 0) intent = 'knowledge';
    return {
      intent: intent,
      confidence: typeof j.confidence === 'number' ? j.confidence : 0.6,
      emotion: String(j.emotion || 'none'),
      reason: String(j.reason || ''),
      evidence: Array.isArray(j.evidence) ? j.evidence.filter(function (x) { return typeof x === 'string' && x.trim(); }).slice(0, 2) : [],
      essay: typeof j.essay === 'string' ? j.essay : '',
      next: String(j.next || ''),
      ms: Date.now() - t0
    };
  }

  /* ---------------- ② 取证 ---------------- */
  function evidence(queries, trace) {
    var out = [];
    queries.forEach(function (q) {
      var hits = E.searchKB(q, 3);
      out = out.concat(hits);
      trace.push({
        tool: 'kb_search',
        label: '知识库检索',
        detail: '“' + q + '” 命中 ' + hits.length + ' 条' + (hits[0] ? '，最高 ' + hits[0].score + '《' + hits[0].title + '》' : ''),
        ms: 0
      });
    });
    // 去重
    var seen = {};
    return out.filter(function (c) {
      if (seen[c.id]) return false;
      seen[c.id] = 1;
      return true;
    });
  }

  /* ---------------- ③ 事实清单：只让模型说这些数字 ---------------- */
  function factsOf(res, snap, evid) {
    var f = [];
    f.push('连续学习 ' + snap['连续学习天数'] + ' 天；距考试 ' + snap['距考试天数'] + ' 天；今日到期复习 ' + snap['今日到期复习'] + ' 词；已学 ' + snap['已学单词'] + ' 词');
    if (snap['累计答题正确率'] !== '0%') f.push('累计答题正确率 ' + snap['累计答题正确率'] + '，未掌握错题 ' + snap['未掌握错题'] + ' 道');
    if (snap['薄弱标签'].length) f.push('薄弱标签：' + snap['薄弱标签'].join('、'));
    if (snap['模考']) f.push('最近模考 ' + snap['模考'].最近总分 + ' 分，目标 ' + snap['模考'].目标 + '，差 ' + snap['模考'].差距 + ' 分，最弱 ' + snap['模考'].最弱项 + '（得分率 ' + snap['模考'].最弱项得分率 + '%）');

    (res.blocks || []).forEach(function (b) {
      if (b.type === 'words' && b.words) {
        f.push('本次选出 ' + b.words.length + ' 个词：' + b.words.map(function (w) { return w.w + '（' + (w.zh || '') + '）'; }).join('、'));
      }
      if (b.type === 'essay' && b.result) {
        var r = b.result;
        f.push('作文 ' + r.wordCount + ' 词，折算 ' + r.cet + '/106.5，评级' + r.band + '；四维：' + r.dims.map(function (d) { return d.name + ' ' + d.score; }).join('、'));
        if (r.issues.length) f.push('主要问题：' + r.issues.slice(0, 3).map(function (i) { return i.type + '—' + i.msg; }).join('；'));
      }
      if (b.type === 'practice' && b.questions) {
        f.push('本次组卷 ' + b.questions.length + ' 题，覆盖 ' + (b.tags || []).join('、'));
      }
      if (b.type === 'mock' && b.analysis) {
        f.push('模考分项：' + b.analysis.rows.map(function (x) { return x.name + ' ' + x.rate + '%'; }).join('、'));
      }
      if (b.type === 'plan' && b.plan) {
        f.push('计划共 ' + b.plan.tasks.length + ' 项 / ' + b.plan.totalMin + ' 分钟，重点 ' + b.plan.focus);
      }
      if (b.type === 'translation' && b.item) {
        f.push('翻译题《' + b.item.title + '》，' + (b.item.phrases || []).length + ' 个关键短语待覆盖');
      }
      if (b.type === 'listening' && b.set) {
        f.push('听力材料《' + b.set.title + '》，' + b.set.type + '，' + b.set.questions.length + ' 题');
      }
      if (b.type === 'sentence' && b.sentence) {
        f.push('句子拆成 ' + b.sentence.segments.length + ' 个意群，' + b.sentence.points.length + ' 个语法点');
      }
      if (b.type === 'errors') {
        f.push('错题本当前展示 ' + b.errors.length + ' 条');
      }
    });

    evid.slice(0, 3).forEach(function (c) {
      f.push('知识库《' + c.title + '》：' + c.text.replace(/\s+/g, ' ').slice(0, 160));
    });
    return f;
  }

  /* ---------------- ④ 生成 ---------------- */
  var WRITE_SYS = [
    '你是「四级智备」的助教，像一位耐心的学长，不像客服。',
    '',
    '写回复的要求：',
    '1. 简体中文，口语化，短句。总长 80–180 字。',
    '2. 如果给了「情绪」，第一句必须先接住它，不要立刻讲道理，不要用「我理解你」这种空话，要具体（比如点出他说的那个分数）。',
    '3. 然后给结论，最后给一个具体动作（用「下一步」字段里的建议，或的事实清单里真实存在的功能）。',
    '4. 只能引用「事实清单」里的数字。清单里没有的数字，一个都不许出现。',
    '5. 不要复述清单，不要罗列功能，不要用 Markdown 表格、代码块、分隔线、表情符号。',
    '6. 不要承诺保过、不要保证提分，不要编造题库数量。',
    '7. 下面会给出「工具已生成的内容」，那是页面上已经显示给学生看的卡片，你的文字不要重复它的内容，只做解释和引导。',
    '',
    '只输出回复正文，不要加任何前缀。'
  ].join('\n');

  /* 把回复里「N 分 / N 词 / N 道 / N 天 / N%」这类数据性引用抽出来，
     和事实清单比对。模型最容易在这里写错数字，不能放任。 */
  function numbersIn(s) {
    var m = String(s || '').match(/\d+(?:\.\d+)?/g) || [];
    return m;
  }
  /* 只校验「数据性引用」：分数 / 词数 / 天数 / 百分比 / 错题数。
     「先做 3 道题」这类动作建议不拦，它们不是事实陈述。 */
  function claimedNumbers(reply) {
    var s = String(reply || '');
    var out = [], m;
    var re1 = /(\d+(?:\.\d+)?)\s*(分|个词|词|天|%)/g;
    while ((m = re1.exec(s))) out.push(m[1]);
    var re2 = /(\d+(?:\.\d+)?)\s*道[^。，；]{0,6}错题/g;
    while ((m = re2.exec(s))) out.push(m[1]);
    return out;
  }
  /* 四级体制内的公开常量，模型引用它们不算编造 */
  var KNOWN_CONST = ['710', '425', '106.5', '0.5', '0.15', '30', '15', '4'];

  function ungrounded(reply, facts, userText) {
    var pool = {};
    KNOWN_CONST.forEach(function (n) { pool[n] = 1; });
    numbersIn(facts.map(function (x) { return x; }).join(' '))
      .concat(numbersIn(userText))
      .forEach(function (n) { pool[n] = 1; });
    return uniq(claimedNumbers(reply).filter(function (n) { return !pool[n]; }));
  }

  async function compose(text, p, facts, res) {
    var t0 = Date.now();
    var emotionLine = p.emotion && p.emotion !== 'none' ? p.emotion : '无';
    var allowed = uniq(numbersIn(facts.join(' ')).concat(numbersIn(text)));

    function payload(extra) {
      var lines = [
        '【学生原话】' + text,
        '【你上一步的判断】意图=' + INTENT_LABEL[p.intent] + '；情绪=' + emotionLine + '；依据=' + p.reason,
        '【下一步建议】' + (p.next || '无'),
        '【事实清单】'
      ];
      Array.prototype.push.apply(lines, facts.map(function (x) { return '- ' + x; }));
      lines.push('【本段允许出现的数字】' + (allowed.length ? allowed.join('、') : '无（不要写任何具体数字）'));
      lines.push('【工具已生成的内容】' + ((res.blocks || []).filter(function (b) { return b.type !== 'text' && b.type !== 'cites'; }).map(function (b) { return b.type; }).join('、') || '无'));
      if (extra) lines.push('【上一版有误】' + extra + ' 这个数字在事实清单里不存在。重写一遍，改用清单里的真实数字，或者不写数字。');
      return lines.join('\n');
    }

    var out = String(await E.callLLM([
      { role: 'system', content: WRITE_SYS },
      { role: 'user', content: payload('') }
    ], { temperature: 0.75, timeout: 20000, maxTokens: 700 }) || '').trim();

    // 数字校验：不实的数字只重写一次，避免无限循环与延迟膨胀
    var bad = ungrounded(out, facts, text);
    var retried = false;
    if (bad.length) {
      retried = true;
      try {
        var out2 = String(await E.callLLM([
          { role: 'system', content: WRITE_SYS },
          { role: 'user', content: payload(bad.join('、')) }
        ], { temperature: 0.5, timeout: 20000, maxTokens: 700 }) || '').trim();
        if (out2) out = out2;
      } catch (e) { /* 重写失败就保留第一版 */ }
    }

    return { text: out, ms: Date.now() - t0, guard: bad, retried: retried };
  }

  /* ---------------- 主流程 ---------------- */
  async function chat(text, opts) {
    opts = opts || {};
    var t0 = Date.now();
    var trace = [];

    if (!enabled()) return E.chat(text, opts);

    var snap = snapshot();

    /* ① 规划 */
    var p;
    try {
      p = await plan(text, snap);
    } catch (e) {
      var r0 = await E.chat(text, opts);
      r0.trace = [{ tool: 'llm_plan', label: '意图规划', detail: '模型不可用，回退本地规则引擎：' + (e.message || '未知错误'), ms: Date.now() - t0 }].concat(r0.trace || []);
      r0.usedLLM = false;
      return r0;
    }

    trace.push({
      tool: 'llm_plan',
      label: '意图规划',
      detail: '判定「' + INTENT_LABEL[p.intent] + '」置信 ' + p.confidence + (p.emotion !== 'none' ? '，情绪：' + p.emotion : '') + '｜依据：' + p.reason.slice(0, 40),
      ms: p.ms
    });
    trace.push({
      tool: 'memory_read',
      label: '读取学习记忆',
      detail: '连续 ' + snap['连续学习天数'] + ' 天，到期 ' + snap['今日到期复习'] + ' 词，薄弱 ' + (snap['薄弱标签'][0] || '—'),
      ms: 0
    });

    /* ② 取证（模型给关键词，本地 BM25 执行） */
    var evid = p.evidence.length ? evidence(p.evidence, trace) : [];

    /* ③ 执行 */
    var res;
    if (p.intent === 'coach') {
      res = { intent: 'coach', blocks: [], cites: [], trace: [] };
    } else {
      var callOpts = { intent: p.intent, noLLM: true };
      if (p.essay && p.essay.trim().length > 40) {
        callOpts.essay = p.essay;
      } else if (p.intent === 'writing' && text.length > 60 && (text.match(/[A-Za-z]/g) || []).length > text.length * 0.4) {
        callOpts.essay = text;
      }
      if (opts.questions) callOpts.questions = opts.questions;
      res = await E.chat(text, callOpts);
    }

    /* ④ 生成 */
    var facts = factsOf(res, snap, evid);
    var reply = null;
    var composeTrace = [];
    try {
      reply = await compose(text, p, facts, res);
      composeTrace.push({
        tool: 'llm_compose',
        label: '生成回复',
        detail: '模型输出 ' + reply.text.length + ' 字，基于 ' + facts.length + ' 条事实' +
          (reply.guard && reply.guard.length ? '｜数字校验：拦下 ' + reply.guard.join('、') + ' 已重写' : ''),
        ms: reply.ms
      });
    } catch (e2) {
      composeTrace.push({ tool: 'llm_compose', label: '生成回复', detail: '生成失败，保留本地模板文案：' + (e2.message || ''), ms: 0 });
    }

    /* ⑤ 合并（保留工具产出的卡片，只替换文字块） */
    var blocks = (res.blocks || []).slice();
    if (reply && reply.text) {
      var idx = -1;
      for (var i = 0; i < blocks.length; i++) if (blocks[i].type === 'text') { idx = i; break; }
      if (idx >= 0) blocks[idx] = { type: 'text', text: reply.text, tag: 'LLM' };
      else blocks.unshift({ type: 'text', text: reply.text, tag: 'LLM' });
    }

    /* ⑥ 计划视图：如实反映刚才走过的步骤 */
    var steps = [
      { id: E.uid('step'), title: '读懂这句话（模型规划）', tool: 'llm_plan', note: p.reason, status: 'done' },
      { id: E.uid('step'), title: '读取学习记忆', tool: 'memory_read', note: '', status: 'done' }
    ];
    if (evid.length) steps.push({ id: E.uid('step'), title: '检索知识库取证', tool: 'kb_search', note: p.evidence.join(' / '), status: 'done' });
    if (p.intent !== 'coach') steps.push({ id: E.uid('step'), title: '执行「' + INTENT_LABEL[p.intent] + '」', tool: p.intent, note: '', status: 'done' });
    steps.push({ id: E.uid('step'), title: '结合记忆生成回复', tool: 'llm_compose', note: '', status: 'done' });

    // 工具轨迹按真实执行顺序拼接；生成环节固定在末尾；重复的记忆读取合并成一条
    var hasMem = trace.some(function (x) { return x.tool === 'memory_read'; });
    var pipeTrace = (res.trace || []).filter(function (t) { return !(t.tool === 'memory_read' && hasMem); });
    var allTrace = trace.concat(pipeTrace).concat(composeTrace);
    var cites = evid.concat(res.cites || []);
    var cseen = {};
    cites = cites.filter(function (c) { if (!c || cseen[c.id]) return false; cseen[c.id] = 1; return true; }).slice(0, 4);

    /* ⑦ 记忆写回 */
    E.state.chat.unshift({ role: 'user', text: text, ts: Date.now() });
    E.state.chat.unshift({ role: 'agent', text: String((reply && reply.text) || '').slice(0, 160), ts: Date.now() });
    E.state.chat = E.state.chat.slice(0, 24);
    E.logEvent('chat', 'Agent 处理：' + text.slice(0, 28), p.intent + ' · ' + allTrace.length + ' 次工具调用 · LLM');
    E.save();

    return {
      intent: res.intent,
      plan: { intent: p.intent, steps: steps },
      trace: allTrace,
      blocks: blocks,
      cites: cites,
      usedLLM: true,
      ms: Date.now() - t0,
      l2: { planner: p, facts: facts }
    };
  }

  window.L2 = {
    enabled: enabled,
    chat: chat,
    planOnly: async function (text) { return plan(text, snapshot()); },
    snapshot: snapshot
  };
})();
</script>
<script>
/* assets/js/app.js */
/* ============================================================
   四级智备 · App（路由 / 页面 / 交互）
   ============================================================ */
(function () {
  'use strict';

  var E = window.Engine;
  var S = E.state;
  var h = E.escape;
  var VIEW = document.getElementById('view');
  var INSP = document.getElementById('inspBody');
  var INSPECTOR = document.getElementById('inspector');
  var OVERLAY = document.getElementById('overlayRoot');
  var TOASTS = document.getElementById('toasts');

  var ui = {
    route: 'dashboard',
    inspTab: 'trace',
    deck: null,
    sentId: null,
    customSentence: null,
    listenId: null,
    listenZh: false,
    listenIdx: -1,
    trId: null,
    trResult: null,
    essayPrompt: null,
    essayResult: null,
    reviewFilter: 'active',
    reviewTag: '',
    kbDocId: null,
    kbQuery: '',
    chatLog: [],
    chatBusy: false,
    practiceTags: null,
    lastRun: null,
    mockDraft: null
  };

  var ROUTES = {
    dashboard: { sec: '工作区', title: '今日概览', render: pageDashboard },
    chat: { sec: '工作区', title: '智能对话', render: pageChat },
    words: { sec: '训练模块', title: '单词背诵', render: pageWords },
    sentences: { sec: '训练模块', title: '长难句解析', render: pageSentences },
    listening: { sec: '训练模块', title: '听力精讲', render: pageListening },
    writing: { sec: '训练模块', title: '作文批改', render: pageWriting },
    translation: { sec: '训练模块', title: '翻译训练', render: pageTranslation },
    review: { sec: '训练模块', title: '错题复盘', render: pageReview },
    mock: { sec: '训练模块', title: '模拟卷分析', render: pageMock },
    practice: { sec: '训练模块', title: '个性化练习', render: pagePractice },
    knowledge: { sec: '系统', title: 'RAG 知识库', render: pageKnowledge },
    settings: { sec: '系统', title: '偏好与模型', render: pageSettings }
  };

  /* ---------------- 小工具 ---------------- */
  function icon(n, cls) { return '<svg' + (cls ? ' class="' + cls + '"' : '') + ' aria-hidden="true"><use href="#' + n + '"/></svg>'; }
  function tag(t, cls) { return '<span class="tag ' + (cls || '') + '">' + h(t) + '</span>'; }
  function btn(label, opts) {
    opts = opts || {};
    return '<button class="btn ' + (opts.cls || '') + '"' + (opts.act ? ' data-act="' + opts.act + '"' : '') +
      (opts.route ? ' data-route="' + opts.route + '"' : '') +
      (opts.id ? ' data-id="' + h(opts.id) + '"' : '') +
      (opts.tag ? ' data-tag="' + h(opts.tag) + '"' : '') +
      (opts.text ? ' data-text="' + h(opts.text) + '"' : '') +
      (opts.disabled ? ' disabled' : '') + '>' + (opts.icon ? icon(opts.icon) : '') + label + '</button>';
  }
  function ring(pct, size, color, label, sub) {
    var r = (size - 9) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
    return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px">' +
      '<svg width="' + size + '" height="' + size + '"><circle class="track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="7"/>' +
      '<circle class="val" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" stroke-width="7" stroke="' + (color || 'var(--ink)') + '" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/></svg>' +
      '<div class="lbl"><b>' + label + '</b><span>' + (sub || '') + '</span></div></div>';
  }
  function dateCn() {
    var d = new Date();
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 星期' + '日一二三四五六'[d.getDay()];
  }
  function timeAgo(ts) {
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    var hh = Math.floor(m / 60);
    if (hh < 24) return hh + ' 小时前';
    return Math.floor(hh / 24) + ' 天前';
  }
  function hm(ts) {
    var d = new Date(ts);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function typeTag(t) {
    var m = { '词汇': 'jade', '语法': 'red', '听力': 'gold', '翻译': '', '写作': 'ink', '阅读': '' };
    return tag(t, m[t] || '');
  }
  function toast(msg, err) {
    var el = document.createElement('div');
    el.className = 'toast' + (err ? ' err' : '');
    el.innerHTML = icon(err ? 'i-alert' : 'i-check') + '<span>' + h(msg) + '</span>';
    TOASTS.appendChild(el);
    setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 260); }, 2600);
  }
  function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function speak(text, rate) {
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音朗读', true); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = rate || 0.92;
    window.speechSynthesis.speak(u);
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function sentenceCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* ---------------- 路由 ---------------- */
  function parseHash() {
    var m = (location.hash || '').match(/^#\/?([a-z-]+)(?:\?(.*))?$/);
    var route = m && ROUTES[m[1]] ? m[1] : 'dashboard';
    var params = {};
    if (m && m[2]) m[2].split('&').forEach(function (kv) {
      var p = kv.split('=');
      params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    return { route: route, params: params };
  }
  function navigate(route, params) {
    var q = params ? '?' + Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&') : '';
    var target = '#/' + route + q;
    if (location.hash === target) render();
    else location.hash = target;
  }
  function render() {
    var p = parseHash();
    ui.route = p.route;
    ui.params = p.params;
    if (p.route === 'practice' && p.params.tag) { ui.practiceTags = [p.params.tag]; }
    document.querySelectorAll('.nav-item[data-route]').forEach(function (n) {
      n.classList.toggle('active', n.getAttribute('data-route') === p.route);
    });
    var meta = ROUTES[p.route];
    document.getElementById('crumb').innerHTML = '<span>' + meta.sec + '</span><span class="sep">/</span><b>' + meta.title + '</b>';
    VIEW.className = 'view' + (p.route === 'chat' ? ' chat-view' : '');
    TOASTS.innerHTML = '';
    VIEW.innerHTML = meta.render();
    mountQuizzes(VIEW);
    refreshChrome();
    if (p.route === 'chat') {
      renderChatMessages();
      var sc = document.querySelector('.chat-scroll');
      if (sc) sc.scrollTop = sc.scrollHeight;
      applyPendingChat();
    }
    closeRail();
  }
  function refreshChrome() {
    var st = E.stats();
    document.getElementById('streakNum').textContent = st.streak || 0;
    document.getElementById('examPill').textContent = '距四级 ' + st.daysToExam + ' 天';
    document.getElementById('avatarBtn').textContent = (S.profile.name || '同').slice(0, 1);
    var due = document.getElementById('navDueBadge');
    due.textContent = st.due;
    due.style.display = st.due ? '' : 'none';
    var err = document.getElementById('navErrBadge');
    err.textContent = st.errors;
    err.style.display = st.errors ? '' : 'none';
    document.getElementById('railMemBar').style.width = Math.max(4, pct(st.learned, st.totalWords)) + '%';
    document.getElementById('railMemNote').textContent = '本地记忆 · ' + S.events.length + ' 条事件 · ' + st.learned + ' 词';
    renderInspector();
  }
  function closeRail() {
    document.getElementById('rail').classList.remove('open');
    if (window.innerWidth <= 1200) INSPECTOR.classList.remove('open');
  }

  /* ---------------- 通用页头 ---------------- */
  function pageHead(title, lede, actions) {
    return '<div class="page-head"><div><h1 class="display">' + title + '</h1><div class="lede">' + lede + '</div></div>' +
      (actions ? '<div class="head-actions">' + actions + '</div>' : '') + '</div>';
  }

  /* ---------------- 今日工作台 ---------------- */
  function pageDashboard() {
    var st = E.stats();
    var plan = E.todayPlan();
    var weak = E.weakTags().slice(0, 4);
    var doneN = plan.tasks.filter(function (t) { return t.done; }).length;
    var hour = new Date().getHours();
    var greet = hour < 6 ? '夜深了' : hour < 11 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
    var focus = weak[0] ? weak[0].tag : '词汇搭配';
    var mock = (E.isDemo() && window.MOCK && window.MOCK.history && window.MOCK.history.length)
      ? window.MOCK.history.slice(-1)[0] : { total: 0 };

    var taskRows = plan.tasks.map(function (t) {
      return '<div class="task-item ' + (t.done ? 'done' : '') + '" data-act="task-go" data-route="' + h(t.route || 'practice') + '" style="cursor:pointer">' +
        '<div class="task-check" data-act="task" data-id="' + t.id + '" role="checkbox" aria-checked="' + t.done + '" tabindex="0" title="标记完成">' + icon('i-check') + '</div>' +
        '<div style="min-width:0"><div class="task-name">' + h(t.title) + '</div>' +
        '<div class="task-meta">' + tag(t.tag, 'line') + '<span>' + h(t.why) + '</span></div></div>' +
        '<div class="task-time">' + t.min + '′</div></div>';
    }).join('');

    var weakRows = weak.map(function (w) {
      var v = Math.min(100, Math.round(w.score * 18));
      return '<div class="weak-row" data-act="practice-tag" data-tag="' + h(w.tag) + '" style="cursor:pointer">' +
        '<div class="weak-name" title="' + h(w.tag) + '">' + h(w.tag) + '</div>' +
        '<div class="weak-bar"><div class="bar thin"><i class="red" style="width:' + Math.max(12, v) + '%"></i></div></div>' +
        '<div class="weak-val">' + (w.acc == null ? w.errors + ' 道' : w.acc + '%') + '</div></div>';
    }).join('') || '<div class="empty">还没有足够数据，先做一组练习。</div>';

    var events = S.events.slice(0, 6).map(function (ev) {
      var dot = ev.type === 'chat' ? 'red' : ev.type === 'task' ? 'jade' : 'gold';
      return '<div class="tl-item"><div class="tl-dot ' + dot + '"></div><div><div class="tl-txt">' + h(ev.title) + '</div>' +
        '<div class="tl-time">' + hm(ev.ts) + ' · ' + h(ev.detail || ev.type) + '</div></div></div>';
    }).join('') || '<div class="empty">今天还没有记录，从背 4 个单词开始。</div>';

    var heat = '';
    for (var i = 13; i >= 0; i--) {
      var d = E.addDays(E.today(), -i);
      var has = S.stats.days.indexOf(d) >= 0;
      heat += '<i class="' + (has ? 'on' : '') + '" style="height:' + (has ? 30 : 12) + 'px" title="' + d + '"></i>';
    }

    return '<div class="page">' +
      '<div class="hero"><div class="hero-main">' +
      '<div class="hero-date">' + dateCn() + '</div>' +

  /* ---------------- 听力 ---------------- */

    return '<div class="page">' +

      '<div class="note mt16">精听五步：盲听 → 记关键词 → 逐句听写 → 对照原文找同义替换 → 跟读 1 遍。不要一开始就看中文。</div></div>' +

      '</div></div></div>';
  }
  function highlightEN(text, vocab) {
    var out = h(text);
    (vocab || []).forEach(function (v) {
      var w = v.w.split(' ')[0];
      if (!w || w.length < 4) return;
      var re = new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*)\\b', 'gi');
      out = out.replace(re, '<span class="mark">$1</span>');
    });
    return out;
  }

  /* ---------------- 练习组件 ---------------- */
  var QUIZ = {};
  function quizMount(id, questions, opts) {
    QUIZ[id] = { questions: questions || [], idx: 0, sel: -1, submitted: false, answers: [], done: false, opts: opts || {} };
    return '<div class="quiz-mount" data-qmid="' + id + '"></div>';
  }
  function drawQuiz(id) {
    var st = QUIZ[id];
    var el = document.querySelector('[data-qmid="' + id + '"]');
    if (!st || !el) return;
    if (!st.questions.length) { el.innerHTML = '<div class="empty">暂无题目</div>'; return; }
    if (st.done) {
      var ok = st.answers.filter(function (a) { return a.ok; }).length;
      var rate = pct(ok, st.answers.length);
      var wrongTags = {};
      st.answers.forEach(function (a) { if (!a.ok) wrongTags[a.q.tag] = (wrongTags[a.q.tag] || 0) + 1; });
      var weakTxt = Object.keys(wrongTags).map(function (k) { return k + '×' + wrongTags[k]; }).join('、');
      el.innerHTML = '<div class="quiz-result">' +
        '<div class="eyebrow">本轮完成</div>' +
        '<div class="big" style="color:' + (rate >= 70 ? 'var(--jade)' : rate >= 50 ? 'var(--gold)' : 'var(--red)') + '">' + rate + '<span style="font-size:18px">%</span></div>' +
        '<div class="muted small">答对 ' + ok + ' / ' + st.answers.length + ' 题' + (st.opts.record ? ' · 已写入记忆' : '') + '</div>' +
        (weakTxt ? '<div class="note red mt12" style="text-align:left">本轮错得最多：' + h(weakTxt) + '。Agent 已把错题加入错题本。</div>' : '<div class="note jade mt12">全部答对，回到对应模块继续加难度。</div>') +

      return;
    }
    var q = st.questions[st.idx];
    var opts = q.options.map(function (o, i) {
      var cls = 'opt';
      if (st.submitted) {
        if (i === q.answer) cls += ' correct';
        else if (i === st.sel) cls += ' wrong';
      } else if (i === st.sel) cls += ' sel';
      return '<button class="' + cls + '" data-qact="opt" data-qid="' + id + '" data-i="' + i + '"' + (st.submitted ? ' disabled' : '') + '>' +
        '<span class="ok">' + 'ABCD'[i] + '</span><span>' + h(o) + '</span></button>';

      '<div class="qstem">' + h(q.stem) + '</div><div class="options">' + opts + '</div>' +
      (st.submitted ? '<div class="explain-box"><b class="' + (st.sel === q.answer ? 'c-jade' : 'c-red') + '">' + (st.sel === q.answer ? '回答正确' : '正确答案：' + 'ABCD'[q.answer] + '. ' + h(q.options[q.answer])) + '</b>' +

      (st.opts.record ? '<span class="tiny muted" style="margin-left:auto;align-self:center">错题自动进入错题本</span>' : '') +
      '</div></div>';
  }
  function quizAction(act, id, i) {
    var st = QUIZ[id];
    if (!st) return;
    if (act === 'opt' && !st.submitted) { st.sel = +i; drawQuiz(id); }
    if (act === 'submit' && st.sel >= 0 && !st.submitted) {
      var q = st.questions[st.idx];
      var ok = st.sel === q.answer;
      q._user = q.options[st.sel];
      st.answers.push({ q: q, ok: ok });
      st.submitted = true;
      if (st.opts.record) {
        E.recordAnswer(q, ok);
        refreshChrome();
        if (!ok) toast('已加入错题本：' + q.tag, true);
      }
      drawQuiz(id);
    }
    if (act === 'next' && st.submitted) {
      if (st.idx >= st.questions.length - 1) { st.done = true; }
      else { st.idx += 1; st.sel = -1; st.submitted = false; }
      drawQuiz(id);
    }
    if (act === 'retry') {
      var qs = st.opts.questionsSource ? st.opts.questionsSource() : st.questions;
      QUIZ[id] = { questions: qs, idx: 0, sel: -1, submitted: false, answers: [], done: false, opts: st.opts };
      drawQuiz(id);
    }
  }

  function inlineMd(s) {
    return h(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function prose(t) {
    var lines = String(t || '').replace(/\r/g, '').split('\n');
    var out = [], buf = [], list = null, ordered = false;
    function flushP() {
      if (buf.length) { out.push('<p>' + buf.map(inlineMd).join('<br>') + '</p>'); buf = []; }
    }
    function flushList() {
      if (list) { out.push('<' + (ordered ? 'ol' : 'ul') + '>' + list.join('') + '</' + (ordered ? 'ol' : 'ul') + '>'); list = null; }
    }
    lines.forEach(function (line) {
      var s = line.trim().replace(/^>\s?/, '');
      if (!s || /^```/.test(s) || /^(?:-{3,}|\*{3,}|_{3,})$/.test(s)) { flushP(); flushList(); return; }
      var hd = s.match(/^#{2,4}\s+(.*)$/);
      if (hd) { flushP(); flushList(); out.push('<h4>' + inlineMd(hd[1]) + '</h4>'); return; }
      var ul = s.match(/^[-*•]\s+(.*)$/);
      if (ul) {
        flushP();
        if (!list || ordered) { flushList(); ordered = false; list = []; }
        list.push('<li>' + inlineMd(ul[1]) + '</li>'); return;
      }
      var ol = s.match(/^\d+[.)]\s+(.*)$/);
      if (ol) {
        flushP();
        if (!list || !ordered) { flushList(); ordered = true; list = []; }
        list.push('<li>' + inlineMd(ol[1]) + '</li>'); return;
      }
      flushList(); buf.push(s);
    });
    flushP(); flushList();
    return '<div class="prose">' + out.join('') + '</div>';
  }

  async function sendChat(text) {
    text = String(text || '').trim();
    if (!text || ui.chatBusy) return;
    ui.chatLog.push({ role: 'user', text: text, ts: Date.now() });
    saveChat();
    ui.chatBusy = true;
    renderChatMessages();
    var input = document.getElementById('chatInput');
    if (input) { input.value = ''; input.style.height = 'auto'; }
    await delay(380);
    try {
      var res = (window.L2 && L2.enabled()) ? await L2.chat(text) : await E.chat(text);
      ui.lastRun = res;
      ui.ragCites = res.cites;
      ui.chatLog.push({ role: 'agent', res: res, ts: Date.now() });
      if (res.intent === 'writing' && res.blocks.some(function (b) { return b.type === 'essay'; })) {
        var eb = res.blocks.filter(function (b) { return b.type === 'essay'; })[0];
        ui.essayResult = eb.result;
        ui.essayDraft = text;
        ui.essayPrompt = eb.prompt ? eb.prompt.id : ui.essayPrompt;
      }
      if (res.intent === 'translation') {
        var tb = res.blocks.filter(function (b) { return b.type === 'translation'; })[0];
        if (tb) { ui.trId = tb.item.id; }
      }
    } catch (err) {
      ui.chatLog.push({ role: 'agent', res: { intent: 'knowledge', plan: { steps: [] }, trace: [], blocks: [{ type: 'text', text: '处理时出错：' + err.message }], cites: [], ms: 0 }, ts: Date.now() });
    }
    saveChat();
    ui.chatBusy = false;
    renderChatMessages();
    refreshChrome();
  }

  function mockChart(hist, target) {
    if (!hist || hist.length < 2) return '<div class="empty">至少两次模考后显示趋势</div>';
    var W = 560, H = 170, pad = 34;
    var vals = hist.map(function (h) { return h.total; }).concat([target]);
    var lo = Math.min.apply(null, vals) - 24, hi = Math.max.apply(null, vals) + 18;
    function X(i) { return pad + i * (W - pad * 2) / (hist.length - 1); }
    function Y(v) { return H - pad - (v - lo) / (hi - lo) * (H - pad * 2); }
    var pts = hist.map(function (h, i) { return X(i) + ',' + Y(h.total); }).join(' ');
    var areaPts = pad + ',' + (H - pad) + ' ' + pts + ' ' + X(hist.length - 1) + ',' + (H - pad);
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="模拟考趋势">' +
      '<defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B03A2B" stop-opacity=".18"/><stop offset="1" stop-color="#B03A2B" stop-opacity="0"/></linearGradient></defs>' +
      '<line x1="' + pad + '" y1="' + Y(target) + '" x2="' + (W - pad) + '" y2="' + Y(target) + '" stroke="#A2782C" stroke-dasharray="4 4" stroke-width="1"/>' +
      '<text x="' + (W - pad) + '" y="' + (Y(target) - 6) + '" text-anchor="end" font-size="10" fill="#A2782C">目标 ' + target + '</text>' +
      '<polygon points="' + areaPts + '" fill="url(#mg)"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="#B03A2B" stroke-width="2" stroke-linejoin="round"/>' +
      hist.map(function (h, i) {
        return '<circle cx="' + X(i) + '" cy="' + Y(h.total) + '" r="4" fill="#FFFDF8" stroke="#B03A2B" stroke-width="2"/>' +
          '<text x="' + X(i) + '" y="' + (Y(h.total) - 10) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#15181B">' + h.total + '</text>' +
          '<text x="' + X(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="10" fill="#8A857A">' + h.date.slice(5) + '</text>';
      }).join('') + '</svg>';
  }

  }

  /* ---------------- 行为分发 ---------------- */
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(function () { toast('已复制到剪贴板'); }, function () { fallbackCopy(t); });
    } else fallbackCopy(t);
  }
  function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch (e) { toast('复制失败，请手动选择', true); }
    ta.remove();
  }
  function answerPlain(res) {
    var lines = [];
    (res.blocks || []).forEach(function (b) {
      if (b.type === 'text') lines.push(b.text);
      if (b.type === 'words') b.words.forEach(function (w) { lines.push(w.w + ' ' + w.ph + ' ' + w.zh + ' — ' + w.ex); });
      if (b.type === 'sentence') lines.push(b.sentence.text + '\n' + b.sentence.translation + '\n骨架：' + b.sentence.skeleton);
      if (b.type === 'essay') lines.push('作文 ' + b.result.cet + '/106.5，' + b.result.band);
      if (b.type === 'mock') lines.push('模考总分 ' + b.analysis.total + '，最弱 ' + b.analysis.weakest.name);
    });
    return lines.join('\n\n');
  }

  function handleAction(a, ev) {
    var act = a.getAttribute('data-act');
    switch (act) {
      case 'go':
        closeModal(); navigate(a.getAttribute('data-route')); break;
      case 'overlay':
        if (ev.target === a) closeModal();
        break;
      case 'modal-close':
        closeModal(); break;
      case 'rail-close':
        closeRail(); break;
      case 'insp-close':
        INSPECTOR.classList.remove('open'); break;
      case 'task':
        E.toggleTask(a.getAttribute('data-id')); render(); refreshChrome();
        toast('任务状态已更新'); break;
      case 'task-go':
        navigate(a.getAttribute('data-route') || 'practice'); break;
      case 'newplan':
        S.plan = E.buildPlan(1); E.save(); render(); toast('已按最新记忆重排计划'); break;
      case 'start-plan': {
        var nt = (S.plan.tasks || []).filter(function (t) { return !t.done; })[0];
        if (nt) navigate(nt.route); else toast('今天的任务已完成');
        break;
      }
      case 'flip':
        if (!ui.deck) break;
        ui.deck.flipped = !ui.deck.flipped;
        a.classList.toggle('flipped', ui.deck.flipped);
        break;
      case 'rate': rateWord(a.getAttribute('data-r')); break;
      case 'new-deck':
        ui.deck = newDeck(); render(); break;
      case 'word-jump':
        if (!ui.deck) break;
        ui.deck.idx = +a.getAttribute('data-i'); ui.deck.flipped = false; render(); break;
      case 'speak-word':
        speak(a.getAttribute('data-w')); break;
      case 'speak-text':
        speak(a.getAttribute('data-text')); break;
      case 'speak-sentence':
        speak(a.getAttribute('data-text')); break;
      case 'sent':
        ui.sentId = a.getAttribute('data-id'); ui.customSentence = null; render(); break;
      case 'toggle-tr': {
        var tr = document.querySelector('.tr-reveal');
        if (tr) tr.classList.toggle('hide');
        break;
      }
      case 'parse-custom': {
        var inp = document.getElementById('sentInput');
        var val = inp ? inp.value.trim() : '';
        if (val.length < 6) { toast('先输入一个英文句子', true); break; }
        ui.customSentence = E.heuristicParse(val);
        ui.sentId = null;
        render();
        toast('已用通用规则拆解');
        break;
      }
      case 'listen-set':
        ui.listenId = a.getAttribute('data-id'); ui.listenIdx = -1; render(); break;
      case 'tline':
        playLine(+a.getAttribute('data-i')); break;
      case 'play-listen':
        playListening(a.getAttribute('data-id')); break;
      case 'stop-speak':
        if ('speechSynthesis' in window) speechSynthesis.cancel(); break;
      case 'toggle-zh':
        ui.listenZh = !ui.listenZh; render(); break;
      case 'ask-agent':
        pendingChat = a.getAttribute('data-text') || '帮帮我';
        navigate('chat'); break;
      case 'chat-quick':
        sendChat(a.getAttribute('data-q')); break;
      case 'chat-send': {
        var ci = document.getElementById('chatInput');
        sendChat(ci ? ci.value : '');
        break;
      }
      case 'insp-tab':
        switchInsp(a.getAttribute('data-tab'));
        if (window.innerWidth <= 1200) INSPECTOR.classList.add('open');
        break;
      case 'copy-answer': {
        var item = ui.chatLog[+a.getAttribute('data-idx')];
        if (item && item.res) copyText(answerPlain(item.res));
        break;
      }
      case 'essay-open':
        ui.essayPrompt = a.getAttribute('data-id'); ui.essayResult = null; ui.essayDraft = '';
        navigate('writing'); break;
      case 'fill-model': {
        var pp = (window.WRITING_PROMPTS || []).filter(function (x) { return x.id === ui.essayPrompt; })[0];
        if (pp) { ui.essayDraft = pp.model; ui.essayResult = null; render(); }
        break;
      }
      case 'clear-essay':
        ui.essayDraft = ''; ui.essayResult = null; render(); break;
      case 'grade-essay': {
        var ta = document.getElementById('essayInput');

        E.logEvent('writing', '作文批改：' + pr.cet + ' / 106.5', pr.wordCount + ' 词 · ' + pr.issues.length + ' 处问题');
        E.addMinutes(10);

      case 'grade-tr': {

        ui.trResult = rr; ui.trDrafts[ui.trId] = tt;
        E.logEvent('translation', '翻译练习：' + rr.score + ' 分', rr.item.title + ' · 命中 ' + rr.hits.length + ' 个短语');
        E.addMinutes(8);

        toast('评分：' + rr.score + ' / 100');

      case 'show-ref': {
        var rb = document.getElementById('refBox');
        if (rb) rb.classList.toggle('hide');
        break;
      }
      case 'tr-item':
        ui.trId = a.getAttribute('data-id'); ui.trResult = null; render(); break;

      }
      case 'practice-tag':

        navigate('practice', { tag: a.getAttribute('data-tag') }); break;
      case 'practice-new':
        ui.practiceQuestions = null; ui.practiceKey = null; render(); break;
      case 'kb-search': {
        var kb = document.getElementById('kbInput');

      }
